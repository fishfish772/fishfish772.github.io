# ================================================================
# Butterfly 主题自定义配置（与主题默认配置深度合并）
# 仿 lamb-fish.github.io：菜单/侧栏/PJAX/搜索/统计 + 预留功能位
# ================================================================

# ---------------- 导航菜单（全部指向已建页面，无死链） ----------------
menu:
  首页: / || fas fa-home
  文章: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  list||fas fa-list:
    随笔: /essays/ || fas fa-pen-nib
    音乐: /music/ || fas fa-music
    友链: /links/ || fas fa-link
    留言板: /messageboard/ || fas fa-comment-dots
    相册: /gallery/ || fas fa-images
    收藏: /bookmarks/ || fas fa-bookmark
    朋友圈: /friends/ || fas fa-user-group
    时间线: /timeline/ || fas fa-clock-rotate-left
  关于: /about/ || fas fa-user
  写作: /admin/ || fas fa-pen

# ---------------- 社交链接（占位，替换成你自己的） ----------------
social:
  fab fa-github: https://github.com/fishfish772/fishfish772.github.io || Github
  fas fa-envelope: mailto:you@example.com || Email

# ---------------- 头像与站点横幅 ----------------
# 固定路径，直接通过 /admin/ 后台的"媒体库"上传同名文件覆盖即可生效：
#   头像   -> source/images/avatar.png （建议 300x300 方形）
#   站点横幅 -> source/images/banner.png（建议 1920x400）
avatar:
  img: /images/avatar.png
  effect: false
top_img: /images/banner.png

# ---------------- 侧栏卡片（仿原站：最新文章/分类/标签/归档/网站信息） ----------------
aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 你和别人不一样，不要迷茫
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/fishfish772/fishfish772.github.io
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！预留页面（随笔/音乐/友链/留言板/相册/收藏/朋友圈/时间线）已就位，内容陆续填充。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ---------------- 访问统计（原站侧栏"网站信息"访客数/浏览量） ----------------
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# ---------------- PJAX（与原站一致） ----------------
pjax:
  enable: true
  exclude:
    - /admin/

# ---------------- 本地搜索（对应原站 search.xml） ----------------
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# ---------------- 数学公式（原站密码学笔记大量公式） ----------------
# per_page: false 时，在需要公式的文章 front-matter 加 mathjax: true
math:
  use: mathjax
  per_page: false
  mathjax:
    enableMenu: true
    tags: none

# ---------------- 代码块 ----------------
code_blocks:
  theme: light
  copy: true
  language: true
  shrink: false

# ---------------- 图片查看（灯箱放大，外链图/上传图均可点击查看） ----------------
lightbox: fancybox

# ---------------- 页脚 ----------------
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: false

# ================================================================
# 预留功能开启说明（按需取消注释/填写）
# ================================================================

# ---- 1. Giscus 评论（随笔页/留言板/文章页共用） ----
# 步骤：仓库开启 Discussions -> giscus.app 获取 repo/repo_id/category_id 填入，
# 再把 comments.use 设为 Giscus
comments:
  use:            # 填 Giscus 后生效；留空=全站不加载评论
  lazyload: true
  count: false
  card_post_count: false
giscus:
  repo:           # 例: fishfish772/fishfish772.github.io
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark

# ---- 2. 音乐页 ----
# 音乐页骨架在 source/music/，开启网易云播放器：在页面内容中取消 APlayer/MetingJS 注释块

# ---- 3. 朋友圈页 ----
# 骨架在 source/friends/，开启需：站点 _config.yml 已启用 feed 生成 atom.xml，
# 并在页面中配置各好友博客 RSS 源

# ---- 4. 加载动画（仿原站入场动画） ----
# 占位文件：source/css/entry.css + source/image/entry-bg.png
# 开启：取消下方 inject 中注释行

# ================================================================
# inject 扩展位（自定义 css/js 从这里挂载）
# ================================================================
inject:
  head:
    # Google Fonts 示例（原站使用 Sora，仿原站加载标语字体）：
    # - <link rel="preconnect" href="https://fonts.googleapis.com">
    # - <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    # 自定义样式入口：
    # - <link rel="stylesheet" href="/css/custom.css">
    # - <link rel="stylesheet" href="/css/entry.css">
  bottom:
    # 自定义脚本入口：
    # - <script src="/js/custom.js"></script>
