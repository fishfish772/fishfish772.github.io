  <title>博客后台 · Decap CMS</title>

</head>
<body>
  <!--
    Decap CMS（原 Netlify CMS）在线编辑入口
    配置见同目录 config.yml：
      - 后端：GitHub 隐式 OAuth（仓库需为 public）
      - 媒体库：source/images（粘贴/拖拽图片自动上传）
      - 集合：posts / pages / data（随笔/友链/相册/时间线）
    本地联调：npx decap-server + hexo server，访问 /admin/
  -->
  <!-- CMS 脚本随仓库分发，不依赖外部 CDN（国内访问稳定） -->
  <script src="./decap-cms.js"></script>
